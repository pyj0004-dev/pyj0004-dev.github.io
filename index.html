<!DOCTYPE html>
<html lang="ko">
<head>
    <title>연예인 얼굴상 테스트</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./mltest_files/jquery-3.4.1.slim.min.js"></script>
    <script src="./mltest_files/tf.min.js"></script>
    <script src="./mltest_files/teachablemachine-image.min.js"></script>
    <link rel="stylesheet" href="./mltest_files/app.css">
</head>

<body>
    <header class="topbar">
        <div class="brand"><span class="brand-icon">🌟</span> 얼굴상 테스트</div>
        <a href="#about">테스트란?</a>
    </header>

    <section class="hero">
        <h1>연예인 <span>얼굴상</span> 테스트</h1>
        <p>사진 한 장으로 나와 닮은 연예인을 AI가 찾아드려요</p>
        <div class="tags">
            <span class="tag">무료</span>
            <span class="tag">개인정보 안전</span>
            <span class="tag">빠른 분석</span>
        </div>
        <div class="hero-emoji">👩‍🎤🌟🕺</div>
    </section>

    <main>
        <div class="card file-upload" id="about">
            <div class="image-upload-wrap dropzone">
                <h2>얼굴 사진을 선택하세요!</h2>
                <input class="file-upload-input" type="file" onchange="readURL(this);" accept="image/*">
                <img src="./mltest_files/upload.png" alt="upload-image">
                <div><span class="btn">사진 선택하기</span></div>
                <p class="hint">JPG, PNG 지원 • 눌러서 업로드하거나 끌어다 놓으세요</p>
            </div>
            <div class="file-upload-content">
                <img class="file-upload-image" id="face-image" alt="your image">
                <div id="loading">
                    <div class="spinner"></div>
                    <p>AI가 사진을 분석중입니다.</p>
                </div>
                <p class="result-message"></p>
                <div id="label-container"></div>
                <button type="button" class="btn try-again-btn" onclick="gaReload()">다른 사진으로 재시도</button>
            </div>
            <p class="hint">사진은 서버에 저장되지 않고 브라우저에서만 분석됩니다.</p>
        </div>
    </main>

    <footer class="footer">
        <p>© 수원대학교 빅데이터분석. All Rights Reserved.</p>
        <a href="https://www.youtube.com/channel/UCQNE2JmbasNYbjGAcuBiRRg">제작 도움: 조코딩 유튜브 채널</a>
    </footer>
    <script>
        function gaReload() {
            window.location.reload();
        }

        function readURL(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    $('.image-upload-wrap').hide();
                    $('#loading').show();
                    $('.file-upload-image').attr('src', e.target.result);
                    $('.file-upload-content').show();
                    $('.image-title').html(input.files[0].name);
                };
                reader.readAsDataURL(input.files[0]);
                init().then(function() {
                    console.log("hello");
                    predict();
                    $('#loading').hide();
                });
            } else {
                removeUpload();
            }
        }

        function removeUpload() {
            $('.file-upload-input').replaceWith($('.file-upload-input').clone());
            $('.file-upload-content').hide();
            $('.image-upload-wrap').show();
        }
        $('.image-upload-wrap').bind('dragover', function() {
            $('.image-upload-wrap').addClass('image-dropping');
        });
        $('.image-upload-wrap').bind('dragleave', function() {
            $('.image-upload-wrap').removeClass('image-dropping');
        });
    </script>
    <script>
        let model, webcam, labelContainer, maxPredictions;
        async function init() {
            if (model) return;
            const modelURL = "./mltest_files/model.json";
            const metadataURL = "./mltest_files/metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                var element = document.createElement("div")
                element.classList.add("row");
                labelContainer.appendChild(element);
            }
        }

        async function predict() {
            var dic_class2information = {};
            dic_class2information['나연'] = 'JYP엔터테인먼트 소속 9인조 그룹 TWICE의 멤버';
            dic_class2information['장원영'] = '스타쉽엔터테인먼트 소속 6인조 걸그룹 IVE의 멤버.';
            dic_class2information['제니'] = 'YG엔터테인먼트 소속 4인조 걸그룹 BLACKPINK의 메인래퍼이자 리드보컬';
            var image = document.getElementById("face-image");
            const prediction = await model.predict(image, false);
            prediction.sort((a, b) => parseFloat(b.probability) - parseFloat(a.probability));
            console.log(prediction[0].className);
            var resultTitle, resultExplain;
            if (prediction[0].className in dic_class2information){
                resultTitle = prediction[0].className;
                resultExplain = dic_class2information[prediction[0].className];
            } else{
                resultTitle = "알수없음";
                resultExplain = "";
            }
            var topIdx = Object.keys(dic_class2information).indexOf(prediction[0].className);
            var title = "<div class='d" + topIdx + "-animal-title'>" + resultTitle + "</div>"
            var explain = "<div class='animal-explain'>" + resultExplain + "</div>"
            $('.result-message').html(title + explain);
            var barWidth;
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability.toFixed(2) > 0.1) {
                    barWidth = Math.round(prediction[i].probability.toFixed(2) * 100) + "%";
                } else if (prediction[i].probability.toFixed(2) >= 0.01) {
                    barWidth = "8%"
                } else {
                    barWidth = "4%"
                }
                var labelTitle = prediction[i].className;
                var idx = Object.keys(dic_class2information).indexOf(prediction[i].className);
                var label = "<div class='animal-label'>" + labelTitle + "</div>"
                var k = Math.max(idx, 0);
                var bar = "<div class='track t" + k + "'><div class='fill f" + k + "' style='width: " + barWidth + "'>" + Math.round(prediction[i].probability.toFixed(2) * 100) + "%</div></div>"
                labelContainer.childNodes[i].innerHTML = label + bar;
            }
        }

        window.dataLayer = window.dataLayer || [];
    </script>
